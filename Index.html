<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>292Bet</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    min-height:100%;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    background:#080808;
    color:#fff;
}

body{
    padding-bottom:75px;
}

button,input{
    font:inherit;
}

.hidden{
    display:none!important;
}

/* TOP BAR */
.topbar{
    height:62px;
    background:#151515;
    border-bottom:2px solid #e0a900;
    display:flex;
    align-items:center;
    justify-content:center;
    position:sticky;
    top:0;
    z-index:20;
}

.logo{
    font-size:29px;
    font-weight:800;
    color:#ffc400;
}

.logo span{
    color:#fff;
}

/* AUTH */
.auth-wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px 16px;
    background:radial-gradient(
        circle at top,
        #302100 0,
        #080808 45%
    );
}

.auth-box{
    width:100%;
    max-width:410px;
    background:#151515;
    border:1px solid #3a3a3a;
    border-radius:18px;
    padding:24px;
    box-shadow:0 12px 40px rgba(0,0,0,.5);
}

.auth-logo{
    text-align:center;
    font-size:36px;
    font-weight:800;
    color:#ffc400;
}

.auth-title{
    text-align:center;
    font-size:22px;
    margin-top:8px;
}

.auth-sub{
    text-align:center;
    color:#999;
    font-size:12px;
    margin:6px 0 22px;
}

.tabs{
    display:flex;
    background:#242424;
    border-radius:10px;
    padding:4px;
    margin-bottom:18px;
}

.tab{
    flex:1;
    border:0;
    background:transparent;
    color:#aaa;
    padding:11px;
    border-radius:8px;
    cursor:pointer;
}

.tab.active{
    background:#ffc400;
    color:#111;
    font-weight:700;
}

.field{
    margin-bottom:13px;
}

.field label{
    display:block;
    color:#ccc;
    font-size:13px;
    margin-bottom:6px;
}

.field input{
    width:100%;
    padding:13px;
    border-radius:9px;
    border:1px solid #3c3c3c;
    background:#0f0f0f;
    color:#fff;
    outline:none;
}

.field input:focus{
    border-color:#ffc400;
}

.primary{
    width:100%;
    border:0;
    background:#ffc400;
    color:#111;
    padding:14px;
    border-radius:9px;
    font-weight:800;
    cursor:pointer;
}

.message{
    min-height:20px;
    color:#ffcf4a;
    text-align:center;
    font-size:12px;
    margin-top:10px;
}

/* HOME */
.banner{
    margin:15px;
    padding:22px 10px;
    text-align:center;
    border-radius:14px;
    background:linear-gradient(
        135deg,
        #805400,
        #ffc400,
        #805400
    );
}

.banner h2{
    color:#111;
    font-size:22px;
    margin-bottom:6px;
}

.banner p{
    color:#222;
    font-size:13px;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:15px;
}

.action{
    display:block;
    text-align:center;
    text-decoration:none;
    padding:14px;
    border-radius:9px;
    font-weight:800;
    color:#fff;
}

.deposit{
    background:#168a45;
}

.withdraw{
    background:#c62828;
}

.section{
    margin:20px 15px 12px;
    color:#ffc400;
    font-size:20px;
    font-weight:800;
}

.games{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:11px;
    padding:0 15px;
}

.game-card{
    background:#171717;
    border:1px solid #303030;
    border-radius:12px;
    overflow:hidden;
}

.game-image{
    width:100%;
    aspect-ratio:1/1;
    background:
        linear-gradient(
            135deg,
            #171717,
            #383838
        );
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:45px;
}

.game-name{
    padding:10px 5px;
    text-align:center;
    font-size:14px;
    font-weight:700;
}

/* ACCOUNT */
.account-head{
    background:#242424;
    border-bottom:1px solid #444;
    padding:16px;
    display:flex;
    align-items:center;
    gap:12px;
}

.back{
    border:0;
    background:none;
    color:#fff;
    font-size:30px;
    cursor:pointer;
}

.account-title{
    font-size:21px;
}

.profile{
    margin:15px;
    background:linear-gradient(
        135deg,
        #edf4fb,
        #dfeaf3
    );
    color:#111;
    border-radius:18px;
    padding:20px;
}

.profile-row{
    display:flex;
    align-items:center;
    gap:14px;
}

.avatar{
    width:72px;
    height:72px;
    border-radius:50%;
    background:#ddd;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
    border:4px solid #fff;
}

.username{
    font-size:20px;
    font-weight:800;
}

.balance{
    font-size:27px;
    font-weight:800;
    margin-top:18px;
}

.account-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:0;
    background:#fff;
    color:#222;
    padding:12px 8px 20px;
}

.account-item{
    min-height:105px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:8px 2px;
    cursor:pointer;
}

.account-icon{
    width:56px;
    height:56px;
    border-radius:50%;
    background:#fff4d9;
    border:1px solid #f0dfb5;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    color:#b98a2b;
    margin-bottom:7px;
}

.account-label{
    font-size:11px;
    line-height:1.25;
}

.logout{
    margin:18px 15px;
    background:#fff;
    border:1px solid #ddd;
    color:#c62828;
    width:calc(100% - 30px);
    padding:13px;
    border-radius:10px;
    font-weight:800;
    cursor:pointer;
}

/* BOTTOM NAV */
.bottom{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:68px;
    background:#151515;
    border-top:1px solid #333;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:50;
}

.nav{
    border:0;
    background:none;
    color:#aaa;
    text-align:center;
    font-size:11px;
    cursor:pointer;
}

.nav span{
    display:block;
    font-size:21px;
    margin-bottom:3px;
}

.nav.active{
    color:#ffc400;
}

/* MOBILE */
@media(max-width:360px){

    .account-grid{
        grid-template-columns:repeat(4,1fr);
    }

    .account-icon{
        width:50px;
        height:50px;
        font-size:24px;
    }

    .account-label{
        font-size:10px;
    }
}
</style>
</head>

<body>

<!-- LOGIN / REGISTER -->

<section id="authPage" class="auth-wrap">

    <div class="auth-box">

        <div class="auth-logo">

        </div>

        <div class="auth-sub">

                <label>

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="পাসওয়ার্ড"
                    required>

            </div>

            <button
                class="primary"
                type="submit">
                লগইন করুন
            </button>

        </form>

        <!-- REGISTER -->

        <form
            id="registerForm"
            class="hidden">

            <div class="field">

                <label>
                    আপনার নাম
                </label>

                <input
                    id="regName"
                    type="text"
                    placeholder="নাম লিখুন"
                    required>

            </div>

            <div class="field">

                <label>
                    ইমেইল
                </label>

                <input
                    id="regEmail"
                    type="email"
                    placeholder="ইমেইল লিখুন"
                    required>

            </div>

            <div class="field">

                <label>
                    পাসওয়ার্ড
                </label>

                <input
                    id="regPassword"
                    type="password"
                    minlength="6"
                    placeholder="কমপক্ষে ৬ অক্ষর"
                    required>

            </div>

            <button
                class="primary"
                type="submit">
                নিবন্ধন করুন
            </button>

        </form>

        <div
            id="authMessage"
            class="message">
        </div>

    </div>

</section>
